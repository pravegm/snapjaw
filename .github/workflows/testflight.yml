name: TestFlight

# Builds a signed Release of Snapjaw (target Snap) with Xcode 27.1 on GitHub's Apple-silicon runner and uploads it to
# App Store Connect, where it appears in TestFlight. The founder's Mac is Intel (no Xcode 27), so this is the build route.
# Adapted from the sister projects' proven testflight.yml (cloud-managed App Store signing, no development certificate).
#
# One-time setup (founder): ci/README.md "TestFlight secrets". Repository secrets (the same four values Squish, Brim and
# the other sister apps use):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the .p8 text, Admin team key), APPLE_TEAM_ID.
# The app record for com.pravegm.snapjaw must exist in App Store Connect first, and
# Snap/Assets.xcassets/AppIcon.appiconset must hold the 1024 icon (from ci.yml's screenshots/app-icon-1024.png).

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What to test (shown in the run summary)"
        type: string
        default: ""
      check_only:
        description: "Only build an unsigned Release archive (no secrets, no upload): catches Release-only errors"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release-check:
    if: ${{ inputs.check_only }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Snap.xcodeproj -scheme Snap -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Snap.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | grep -E "error:|warning: .*Snap/|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
      - name: Check the archive
        run: |
          APP="$RUNNER_TEMP/Snap.xcarchive/Products/Applications/Snap.app"
          test -f "$APP/PrivacyInfo.xcprivacy" && plutil -lint "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleDisplayName" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :UISupportedInterfaceOrientations" "$APP/Info.plist"
          test -f "$APP/Assets.car" && echo "asset catalog present"
          # Demo/CI code must not ship. '-snapDemo' itself may legitimately stay in Release (the app may check the
          # argument to keep logging off); the demo parser's keys (Snap/App/DemoMode.swift) and the SNAP-T log lines are
          # DEBUG-only (design/ROUND-1.md), so finding one in the Release binary means demo code leaked out of #if DEBUG.
          # NOTE: Swift keeps string literals of <= 15 UTF-8 bytes inline in the machine code ("small strings"), so
          # `strings` may not see "freezeAfter" (11 bytes) even in Debug. It stays as the named key, and the 21-byte log
          # literal "SNAP-T variety grown" is the leg that can surely fire (ci.yml checks it IS seen in a Debug build).
          if strings "$APP/Snap" | grep -qE "^freezeAfter$|SNAP-T variety grown"; then echo "::error::demo-mode code found in the Release binary"; exit 1; else echo "no demo strings in Release"; fi
          du -sh "$APP"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-log
          path: archive.log
          if-no-files-found: ignore

  upload:
    if: ${{ !inputs.check_only }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See ci/README.md \"TestFlight secrets\"."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Flatten the app icon (no alpha channel for the App Store)
        # App Store Connect refuses a 1024 icon with an alpha channel, even a fully opaque one (ITMS-90717). Flattened in
        # the workspace for this build only (never committed). No PNG at all means no icon: stop before signing.
        run: |
          shopt -s nullglob
          icons=(Snap/Assets.xcassets/AppIcon.appiconset/*.png)
          if (( ${#icons[@]} == 0 )); then
            echo "::error::no PNG in Snap/Assets.xcassets/AppIcon.appiconset. Commit ci.yml's screenshots/app-icon-1024.png there as AppIcon-1024.png (with a Contents.json 1024 slot)."
            exit 1
          fi
          xcrun swift ci/flatten-png.swift "${icons[@]}"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the API key
        run: |
          umask 077
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (Release) without creating a development certificate
        # Sister run 40266619846 failed: "Your account has reached the maximum number of certificates". Automatic signing
        # on an ephemeral runner creates a new Apple Development certificate every run (Squish's CI does the same, same
        # account). So the archive is not development-signed any more: first try an ad-hoc signature (keeps the
        # entitlements in the binary for the export to carry over), else archive unsigned. The App Store signature is
        # applied by the export step below with Apple's cloud-managed distribution certificate (Admin API key).
        run: |
          set -o pipefail
          common=(-project Snap.xcodeproj -scheme Snap -configuration Release -destination 'generic/platform=iOS'
                  -archivePath "$RUNNER_TEMP/Snap.xcarchive" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
                  DEVELOPMENT_TEAM="$APPLE_TEAM_ID")
          if xcodebuild archive "${common[@]}" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
               2>&1 | tee archive.log | grep -E "error:|warning: .*Snap/|\*\* ARCHIVE"; \
             grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log; then
            echo "ARCHIVE_MODE=adhoc" >> "$GITHUB_ENV"
          else
            echo "::warning::ad-hoc archive failed; archiving unsigned"
            rm -rf "$RUNNER_TEMP/Snap.xcarchive"
            xcodebuild archive "${common[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              2>&1 | tee archive.log | grep -E "error:|warning: .*Snap/|\*\* ARCHIVE" || true
            grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
            # Sister run 40268420116: an unsigned archive exports fine but without the Game Center entitlement (the
            # export carries over only what the archived binary's signature declares). Stamp the entitlements on with a
            # local ad-hoc signature (no certificate involved); the export then re-signs for the App Store and keeps them.
            APP="$RUNNER_TEMP/Snap.xcarchive/Products/Applications/Snap.app"
            codesign --force --sign - --timestamp=none --entitlements Snap/Snap.entitlements "$APP"
            codesign -d --entitlements :- "$APP" 2>/dev/null | grep -c "game-center" || true
            echo "ARCHIVE_MODE=unsigned+adhoc-entitlements" >> "$GITHUB_ENV"
          fi

      - name: Check the archive
        run: |
          APP="$RUNNER_TEMP/Snap.xcarchive/Products/Applications/Snap.app"
          test -f "$APP/PrivacyInfo.xcprivacy" && plutil -lint "$APP/PrivacyInfo.xcprivacy"
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          if [ "$BUILT" != "${{ github.run_number }}" ]; then
            echo "::error::CFBundleVersion is '$BUILT', not the run number ${{ github.run_number }}."
            exit 1
          fi
          # The shipped binary itself carries no demo-mode code (App Review and the App Store run this same binary).
          # Same guard as release-check: no DEBUG-only demo keys or SNAP-T log literals in what goes to testers.
          if strings "$APP/Snap" | grep -qE "^freezeAfter$|SNAP-T variety grown"; then echo "::error::demo-mode code found in the Release binary"; exit 1; else echo "no demo strings in Release"; fi

      - name: Export locally and check the App Store signature
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportLocal.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Snap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" -exportPath "$RUNNER_TEMP/local" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export-local.log | grep -E "error:|EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" export-local.log
          mkdir -p "$RUNNER_TEMP/ipa" && cd "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/local/*.ipa
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          codesign -d --entitlements :- "$APP" > ent.plist 2>/dev/null || true
          cat ent.plist
          echo "archive mode: $ARCHIVE_MODE"
          if grep -q "com.apple.developer.game-center" ent.plist; then
            echo "GC_ENT=yes" >> "$GITHUB_ENV"
          else
            echo "GC_ENT=no" >> "$GITHUB_ENV"
            echo "::warning::Game Center entitlement missing from the App Store signature (archive mode $ARCHIVE_MODE): Game Center will stay signed out in this build."
          fi

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Snap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|Upload|EXPORT|uploaded" || true
          grep -qE "\*\* EXPORT SUCCEEDED \*\*|Upload succeeded|Uploaded" export.log

      - name: Summary
        if: success()
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Uploaded Snapjaw build ${{ github.run_number }} to App Store Connect"
            echo "Archive: $ARCHIVE_MODE (no development certificate created). Game Center entitlement in the App Store signature: $GC_ENT."
            echo "It shows up in TestFlight after Apple's processing (usually 10–30 min). Check it with the tf-status workflow."
            if [ -n "$NOTES" ]; then
              echo ""
              echo "**What to test:** $NOTES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
